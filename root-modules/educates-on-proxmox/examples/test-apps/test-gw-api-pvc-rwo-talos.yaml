# ConfigMap to hold the index.html content
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content-rwo
data:
  index.html: |
    <h1>Everything is working!</h1>
    <p>This file was automatically deployed via ConfigMap and InitContainer.</p>
---
# ConfigMap for Nginx configuration (using non-privileged settings)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config-rwo
data:
  default.conf: |
    server {
        listen 8080;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
---
# PersistentVolumeClaim for dynamic storage provisioning
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-rwo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 100Mi}
---
# Deployment with InitContainer to seed the volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-rwo
spec:
  replicas: 1
  selector:
    matchLabels: {app: test-web-rwo}
  template:
    metadata:
      labels: {app: test-web-rwo}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # InitContainer copies the index.html from the ConfigMap into the PVC
      # Using 'alpine' as a neutral image to avoid permission issues
      initContainers:
      - name: setup-data
        image: alpine:latest
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        command: ['sh', '-c', 'cp /tmp/index.html /usr/share/nginx/html/index.html']
        volumeMounts:
        - name: html-source
          mountPath: /tmp
        - name: data
          mountPath: /usr/share/nginx/html
      containers:
      - name: nginx
        # Using unprivileged image to comply with restricted security standards
        image: nginxinc/nginx-unprivileged:alpine
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
        - name: config-vol
          mountPath: /etc/nginx/conf.d/
      volumes:
      - name: html-source
        configMap:
          name: web-content-rwo
      - name: data
        persistentVolumeClaim:
          claimName: test-pvc-rwo
      - name: config-vol
        configMap:
          name: nginx-config-rwo
---
# Service to expose the pod internally
apiVersion: v1
kind: Service
metadata:
  name: test-svc-rwo
spec:
  selector: {app: test-web-rwo}
  ports: [{port: 8080, targetPort: 8080}]
