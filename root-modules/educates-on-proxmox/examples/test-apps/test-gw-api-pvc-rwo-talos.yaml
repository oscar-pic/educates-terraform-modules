---
# HTTPRoute to expose the service via Gateway API (TLS terminated at Gateway)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route-rwo
  namespace: default
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway-system
    # Specifies the sectionName corresponding to the 443/HTTPS listener
    sectionName: https 
  hostnames:
  - "test-api-gw-pvc-rwo.talos-app.axlab.inet"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: test-svc-rwo
          # Gateway handles SSL, so traffic is passed to the pod on port 8080
          port: 8080