apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: proxmox-cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: web-server
  labels:
    app: visual-demo
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: web-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: web-data
      persistentVolumeClaim:
        claimName: web-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: visual-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort